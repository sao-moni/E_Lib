<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Library</title>
    <link rel="stylesheet" href="assets/css/styleLogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="form-box login">
            <form action="" id="login_form">
                <h1>Login</h1>
                <div class="input">
                    <input type="text" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>or login with social platforms</p>
                <div class="social-icons" id="socialLink">
                    <a href="index.html"><i class="fa-brands fa-google"></i></a>
                    <a href="index.html"><i class="fa-brands fa-facebook"></i></a>
                    <a href="index.html"><i class="fa-brands fa-github"></i></a>
                    <a href="index.html"><i class="fa-brands fa-telegram"></i></a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form action="" id="register_form">
                <h1>Registration</h1>
                <div class="input">
                    <input type="text" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input">
                    <input type="email" placeholder="Email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Register</button>
                <p>or register with social platforms</p>
                <div class="social-icons" id="socialLink">
                    <a href="index.html"><i class="fa-brands fa-google"></i></a>
                    <a href="index.html"><i class="fa-brands fa-facebook"></i></a>
                    <a href="index.html"><i class="fa-brands fa-github"></i></a>
                    <a href="index.html"><i class="fa-brands fa-telegram"></i></a>
                </div>
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <script src="assets/js/srip.js"></script>
</body>

</html>
